name: Release

on:
  push:
    tags: [v0.1.0]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --global 'npm@^11.5.1'
      - run: npm ci
      - name: Verify release tag
        run: test "$GITHUB_REF_NAME" = "v0.1.0"
      - run: npm run validate
      - run: npm run lint
      - run: node scripts/check-packages.mjs "$GITHUB_REF_NAME"
      - name: Publish runtime packages
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -z "${NPM_TOKEN:-}" ]]; then
            echo "::error::The first v0.1.0 publish requires the NPM_TOKEN bootstrap secret; npm trusted publishers can only be configured after packages exist."
            exit 1
          fi
          export NODE_AUTH_TOKEN="$NPM_TOKEN"
          npm publish --workspace @culto/taskdroid-core --access public --provenance --registry=https://registry.npmjs.org/
          npm publish --workspace @culto/taskdroid-server --access public --provenance --registry=https://registry.npmjs.org/
          npm publish --workspace @culto/taskdroid-mcp --access public --provenance --registry=https://registry.npmjs.org/
          npm publish --workspace @culto/taskdroid --access public --provenance --registry=https://registry.npmjs.org/
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
