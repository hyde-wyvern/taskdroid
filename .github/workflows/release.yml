name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
          scope: "@culto"
          package-manager-cache: false
      - run: npm install --global npm@11.5.1
      - run: npm ci
      - name: Verify release tag
        run: |
          if [[ "$GITHUB_REF_NAME" == "v0.1.0" ]]; then
            echo "::error::v0.1.0 is the completed bootstrap release and must not be rerun."
            exit 1
          fi
      - run: npm run validate
      - run: npm run lint
      - run: node scripts/check-packages.mjs "$GITHUB_REF_NAME"
      - name: Publish runtime packages
        run: |
          npm publish --workspace @culto/taskdroid-core --access public --provenance --registry=https://registry.npmjs.org/
          npm publish --workspace @culto/taskdroid-server --access public --provenance --registry=https://registry.npmjs.org/
          npm publish --workspace @culto/taskdroid-mcp --access public --provenance --registry=https://registry.npmjs.org/
          npm publish --workspace @culto/taskdroid --access public --provenance --registry=https://registry.npmjs.org/
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
